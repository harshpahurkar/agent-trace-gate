[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Runtime checkpoints for AI-generated code: OpenTelemetry-traced execution gates that catch hallucinated imports, fake APIs, and schema drift before merge."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Pahurkar" }]
dependencies = [
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "rich>=13.7",
    "pyright>=1.1.390",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrace"]
