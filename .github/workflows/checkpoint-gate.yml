# Two jobs:
#
#   seeded-proof — runs `agenttrace demo`, which asserts every seeded sample
#     produces exactly the failure it models. This job is simultaneously the
#     demo's proof and the engine's regression suite: it goes red the moment
#     the pipeline stops catching a planted bug.
#
#   pr-gate — the actual merge gate. Diffs the PR against its base, runs the
#     checkpoint pipeline over any watched files that changed, annotates
#     failures inline, and blocks the merge on any unexpected verdict.
#     Add it to branch protection on main and hallucinations can't land.
#
# Both jobs run Jaeger from the same compose file used locally, so span
# export exercises the real path and the raw traces get uploaded as a
# debuggable artifact.

name: checkpoint-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  seeded-proof:
    name: prove seeded bugs are caught
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: start jaeger
        run: docker compose up -d jaeger

      - name: install
        run: |
          pip install -e ./checkpoints
          npm ci

      - name: run seeded demo (static + runtime paths)
        run: |
          agenttrace demo --report github
          agenttrace demo --report console --skip-static

      - name: export traces
        if: always()
        run: python scripts/export_traces.py || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint-traces
          path: traces.json
          if-no-files-found: ignore

  pr-gate:
    name: gate AI-authored changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: start jaeger
        run: docker compose up -d jaeger

      - name: install
        run: |
          pip install -e ./checkpoints
          npm ci

      - name: checkpoint gate vs base
        run: agenttrace check --base "origin/${{ github.base_ref }}" --report github

      - name: export traces
        if: always()
        run: python scripts/export_traces.py || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-traces
          path: traces.json
          if-no-files-found: ignore
