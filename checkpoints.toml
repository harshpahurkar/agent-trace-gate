# Declares what the checkpoint gate watches.
#
# Each target names a file, its language, and the contract describing its
# boundary behaviour. `expect` documents the verdict a SEEDED sample is
# supposed to produce — `agenttrace demo` (and `scripts/gate.sh`) assert the
# pipeline reaches exactly that verdict, so the demo doubles as the engine's
# regression suite. Real project files you add later just omit `expect`:
# then anything other than a clean pass blocks the merge.

[settings]
timeout_seconds = 20

# ---- python ----------------------------------------------------------------

[[targets]]
name = "weather_report"
file = "samples/python/passing/weather_report.py"
language = "python"
contract = "samples/python/contracts/weather_report.contract.py"
expect = "pass"

[[targets]]
name = "report_gen"
file = "samples/python/hallucinated_import/report_gen.py"
language = "python"
contract = "samples/python/contracts/report_gen.contract.py"
expect = "hallucinated-import"

[[targets]]
name = "date_utils"
file = "samples/python/hallucinated_attr/date_utils.py"
language = "python"
contract = "samples/python/contracts/date_utils.contract.py"
expect = "hallucinated-api"

[[targets]]
name = "user_api"
file = "samples/python/schema_mismatch/user_api.py"
language = "python"
contract = "samples/python/contracts/user_api.contract.py"
expect = "schema-mismatch"

